<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p>Seja Bem-Vindo novamente. Faça login para acessar sua conta e fazer as configurações no seu ambiente</p>
                <form action="login.php" method="post" autocomplete="on">
                    <div class="campo">
                        <i class="material-icons">person</i>
                        <input type="email" name="log" id="ilogin" autocomplete="email" required placeholder="Seu Email" maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>
                    <div class="campo">
                        <i class="material-icons">vpn_key</i>
                        <input type="password" name="sen" id="isen" required autocomplete="current-password" placeholder="Sua Senha " minlength="8" maxlength="20">
                        <label for="isen">Senha</label>
                    </div>
                    <input type="submit" value="Login">
                    <a href="esqueci.html" class="botao">Esqueci a Senha
                    <i class="material-icons">mail</i>
                    </a>

                </form>

            </div>

        </section>
    </main>
</body>
</html>
